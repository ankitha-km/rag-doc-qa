<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DocMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171C;
    --surface:#1B1F26;
    --surface-raised:#20242C;
    --border:#2A2F38;
    --text:#ECE9E2;
    --text-muted:#8B8F98;
    --accent:#E8AE3E;
    --accent-dim:#3A3122;
    --accent-ink:#1A1508;
    --danger:#D9695C;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  .brand{
    font-family:'Fraunces',serif;
    font-weight:600;
  }
  a{color:var(--accent);}

  #app{display:flex; height:100vh;}

  /* ── Left rail ── */
  #rail{
    width:300px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:28px 22px;
    overflow-y:auto;
  }
  #rail h1{
    font-size:22px;
    margin:0 0 2px;
  }
  #rail .tagline{
    color:var(--text-muted);
    font-size:13px;
    margin:0 0 28px;
  }

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--text-muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 11px;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
  }
  .field input:focus{
    outline:none;
    border-color:var(--accent);
  }

  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .btn-primary{
    width:100%;
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:600;
    padding:10px 14px;
    border-radius:8px;
    font-size:14px;
  }
  .btn-primary:disabled{opacity:.5; cursor:not-allowed;}
  .btn-primary:hover:not(:disabled){filter:brightness(1.08);}

  .btn-ghost{
    background:none;
    color:var(--text-muted);
    font-size:13px;
    padding:6px 0;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .btn-ghost:hover{color:var(--text);}

  .auth-toggle{
    display:flex;
    gap:4px;
    margin-bottom:20px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:3px;
  }
  .auth-toggle button{
    flex:1;
    background:none;
    color:var(--text-muted);
    padding:7px 0;
    border-radius:6px;
    font-size:13px;
    font-weight:500;
  }
  .auth-toggle button.active{
    background:var(--surface-raised);
    color:var(--text);
  }

  .error-msg{
    color:var(--danger);
    font-size:13px;
    margin:-6px 0 14px;
  }

  #rail-signed-in{display:none; flex-direction:column; flex:1; min-height:0;}
  #rail-signed-in.visible{display:flex;}

  .rail-section-title{
    font-size:12.5px;
    color:var(--text-muted);
    margin:0 0 10px;
  }

  #upload-zone{
    border:1px dashed var(--border);
    border-radius:var(--radius);
    padding:20px 14px;
    text-align:center;
    margin-bottom:22px;
    transition:border-color .15s;
  }
  #upload-zone.dragover{border-color:var(--accent);}
  #upload-zone p{
    margin:0 0 10px;
    font-size:13px;
    color:var(--text-muted);
  }
  #file-input{display:none;}
  .btn-small{
    background:var(--surface-raised);
    color:var(--text);
    border:1px solid var(--border);
    padding:7px 12px;
    border-radius:7px;
    font-size:13px;
  }
  .btn-small:hover{border-color:var(--accent);}

  #active-doc{
    background:var(--surface-raised);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:13px 14px;
    margin-bottom:22px;
    display:none;
  }
  #active-doc.visible{display:block;}
  #active-doc .doc-name{
    font-weight:500;
    font-size:14px;
    margin-bottom:3px;
    word-break:break-word;
  }
  #active-doc .doc-meta{
    color:var(--text-muted);
    font-size:12.5px;
  }

  #doc-list{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .doc-item{
    padding:9px 10px;
    border-radius:7px;
    font-size:13px;
    color:var(--text-muted);
    cursor:pointer;
    word-break:break-word;
  }
  .doc-item:hover{background:var(--surface-raised); color:var(--text);}
  .doc-item .doc-item-date{
    font-size:11.5px;
    color:var(--text-muted);
    margin-top:1px;
  }

  #signout{margin-top:14px;}

  /* ── Main pane ── */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  #main-header{
    padding:20px 32px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
  }
  #main-header h2{
    font-size:16px;
    margin:0;
    font-weight:500;
    color:var(--text-muted);
  }
  #main-header h2 .fn{color:var(--text);}

  #chat{
    flex:1;
    overflow-y:auto;
    padding:28px 32px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--text-muted);
    max-width:360px;
  }
  .empty-state h3{
    font-family:'Fraunces',serif;
    font-weight:500;
    color:var(--text);
    font-size:20px;
    margin-bottom:8px;
  }

  .msg{
    max-width:640px;
    animation:rise .25s ease-out;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .msg-question{
    align-self:flex-end;
    background:var(--surface-raised);
    border-radius:14px 14px 3px 14px;
    padding:11px 16px;
    font-size:14.5px;
  }
  .msg-answer{
    align-self:flex-start;
    padding:2px 2px 0;
  }
  .msg-answer .answer-text{
    font-size:15px;
    white-space:pre-wrap;
  }
  .citations{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .citation-chip{
    background:var(--accent-dim);
    color:var(--accent);
    font-size:12px;
    padding:3px 9px;
    border-radius:20px;
    cursor:default;
  }

  #composer{
    padding:18px 32px 26px;
    border-top:1px solid var(--border);
    display:flex;
    gap:10px;
  }
  #question-input{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 15px;
    border-radius:10px;
    font-size:14.5px;
    font-family:inherit;
  }
  #question-input:focus{outline:none; border-color:var(--accent);}
  #ask-btn{
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:600;
    padding:0 22px;
    border-radius:10px;
    font-size:14px;
  }
  #ask-btn:disabled{opacity:.5; cursor:not-allowed;}

  .typing{
    display:flex;
    gap:4px;
    padding:6px 0;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--text-muted);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{
    0%,80%,100%{transform:translateY(0); opacity:.4;}
    40%{transform:translateY(-4px); opacity:1;}
  }
</style>
</head>
<body>

<div id="app">

  <!-- LEFT RAIL -->
  <div id="rail">
    <h1 class="brand">DocMind</h1>
    <p class="tagline">Ask your own documents.</p>

    <!-- Signed-out: auth forms -->
    <div id="rail-signed-out">
      <div class="auth-toggle">
        <button id="tab-login" class="active">Log in</button>
        <button id="tab-register">Register</button>
      </div>

      <div id="error-box" class="error-msg" style="display:none;"></div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <button id="auth-submit" class="btn-primary">Log in</button>
    </div>

    <!-- Signed-in: upload + doc list -->
    <div id="rail-signed-in">
      <div id="upload-zone">
        <p>Drop a PDF here, or</p>
        <button id="browse-btn" class="btn-small">Choose file</button>
        <input id="file-input" type="file" accept="application/pdf" />
      </div>

      <div id="active-doc">
        <div class="doc-name" id="active-doc-name"></div>
        <div class="doc-meta" id="active-doc-meta"></div>
      </div>

      <p class="rail-section-title">Previously uploaded</p>
      <div id="doc-list"></div>

      <button id="signout" class="btn-ghost">Sign out</button>
    </div>
  </div>

  <!-- MAIN PANE -->
  <div id="main">
    <div id="main-header">
      <h2 id="main-title">Sign in to get started</h2>
      <button id="summarize-btn" class="btn-small" style="display:none;">Summarize</button>
    </div>

    <div id="chat">
      <div class="empty-state" id="empty-state">
        <h3>Nothing indexed yet</h3>
        <p>Upload a PDF on the left, then ask it anything — answers are grounded in the actual pages, with citations.</p>
      </div>
    </div>

    <div id="composer" style="display:none;">
      <input id="question-input" placeholder="Ask a question about your document…" />
      <button id="ask-btn">Ask</button>
    </div>
  </div>

</div>

<script>
const API_BASE = "https://rag-doc-qa-959q.onrender.com";

// Token lives in memory only for this page session — you'll re-login on refresh.
let token = null;
let activeDocId = null;
let activeDocName = null;
let authMode = "login"; // or "register"

const $ = (id) => document.getElementById(id);

// ── Auth tab switching ──
$("tab-login").onclick = () => setAuthMode("login");
$("tab-register").onclick = () => setAuthMode("register");

function setAuthMode(mode){
  authMode = mode;
  $("tab-login").classList.toggle("active", mode === "login");
  $("tab-register").classList.toggle("active", mode === "register");
  $("auth-submit").textContent = mode === "login" ? "Log in" : "Create account";
  hideError();
}

function showError(msg){
  const box = $("error-box");
  box.textContent = msg;
  box.style.display = "block";
}
function hideError(){ $("error-box").style.display = "none"; }

$("auth-submit").onclick = async () => {
  hideError();
  const username = $("username").value.trim();
  const password = $("password").value;
  if (!username || !password) { showError("Enter a username and password."); return; }

  $("auth-submit").disabled = true;
  try {
    if (authMode === "register") {
      const res = await fetch(`${API_BASE}/auth/register`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password}),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Registration failed");
      onSignedIn(data.access_token);
    } else {
      const form = new URLSearchParams();
      form.append("username", username);
      form.append("password", password);
      const res = await fetch(`${API_BASE}/auth/login`, { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Login failed");
      onSignedIn(data.access_token);
    }
  } catch (err) {
    showError(err.message);
  } finally {
    $("auth-submit").disabled = false;
  }
};

function onSignedIn(t){
  token = t;
  $("rail-signed-out").style.display = "none";
  $("rail-signed-in").classList.add("visible");
  $("main-title").textContent = "Upload a document to begin";
  refreshDocList();
}

$("signout").onclick = () => {
  token = null;
  activeDocId = null;
  $("rail-signed-in").classList.remove("visible");
  $("rail-signed-out").style.display = "block";
  $("username").value = "";
  $("password").value = "";
  $("chat").innerHTML = "";
  $("composer").style.display = "none";
  $("summarize-btn").style.display = "none";
  $("active-doc").classList.remove("visible");
  $("main-title").textContent = "Sign in to get started";
};

function authHeaders(extra = {}){
  return { "Authorization": `Bearer ${token}`, ...extra };
}

// ── Upload ──
$("browse-btn").onclick = () => $("file-input").click();
$("file-input").onchange = (e) => { if (e.target.files[0]) uploadFile(e.target.files[0]); };

const dropZone = $("upload-zone");
["dragover","dragenter"].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault(); dropZone.classList.add("dragover");
}));
["dragleave","drop"].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault(); dropZone.classList.remove("dragover");
}));
dropZone.addEventListener("drop", e => {
  const file = e.dataTransfer.files[0];
  if (file) uploadFile(file);
});

async function uploadFile(file){
  if (file.type !== "application/pdf") { alert("Only PDF files are supported."); return; }

  $("browse-btn").textContent = "Uploading…";
  $("browse-btn").disabled = true;
  try {
    const formData = new FormData();
    formData.append("file", file);
    const res = await fetch(`${API_BASE}/documents/upload`, {
      method: "POST",
      headers: authHeaders(),
      body: formData,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Upload failed");

    activeDocId = data.document_id;
    activeDocName = data.filename;
    $("active-doc-name").textContent = data.filename;
    $("active-doc-meta").textContent = `${data.pages} pages · ${data.chunks} chunks`;
    $("active-doc").classList.add("visible");

    $("main-title").innerHTML = `Asking <span class="fn">${escapeHtml(data.filename)}</span>`;
    $("summarize-btn").style.display = "inline-block";
    $("composer").style.display = "flex";
    $("chat").innerHTML = "";
    $("empty-state").remove;
    $("question-input").focus();

    refreshDocList();
  } catch (err) {
    alert(err.message);
  } finally {
    $("browse-btn").textContent = "Choose file";
    $("browse-btn").disabled = false;
  }
}

async function refreshDocList(){
  try {
    const res = await fetch(`${API_BASE}/documents`, { headers: authHeaders() });
    const docs = await res.json();
    const list = $("doc-list");
    list.innerHTML = "";
    docs.forEach(doc => {
      const item = document.createElement("div");
      item.className = "doc-item";
      const date = new Date(doc.created_at).toLocaleDateString(undefined, {month:"short", day:"numeric"});
      item.innerHTML = `${escapeHtml(doc.filename)}<div class="doc-item-date">${date} · ${doc.pages}p</div>`;
      item.onclick = () => loadHistory(doc.id, doc.filename);
      list.appendChild(item);
    });
  } catch (err) { /* silently ignore — non-critical */ }
}

async function loadHistory(docId, filename){
  try {
    const res = await fetch(`${API_BASE}/documents/${docId}/history`, { headers: authHeaders() });
    const entries = await res.json();
    $("chat").innerHTML = "";
    $("main-title").innerHTML = `Viewing history for <span class="fn">${escapeHtml(filename)}</span>`;
    if (entries.length === 0) {
      $("chat").innerHTML = `<div class="empty-state"><h3>No questions yet</h3><p>Nothing's been asked about this document.</p></div>`;
    }
    entries.forEach(e => renderExchange(e.question, e.answer, []));
    // Only the most recently uploaded doc accepts new questions (v1 backend limitation)
    $("composer").style.display = (docId === activeDocId) ? "flex" : "none";
  } catch (err) { alert("Couldn't load history."); }
}

// ── Ask ──
$("ask-btn").onclick = askQuestion;
$("question-input").addEventListener("keydown", e => { if (e.key === "Enter") askQuestion(); });

async function askQuestion(){
  const question = $("question-input").value.trim();
  if (!question || !activeDocId) return;

  $("question-input").value = "";
  $("ask-btn").disabled = true;
  document.querySelector(".empty-state")?.remove();

  const qEl = document.createElement("div");
  qEl.className = "msg msg-question";
  qEl.textContent = question;
  $("chat").appendChild(qEl);

  const typingEl = document.createElement("div");
  typingEl.className = "msg msg-answer";
  typingEl.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  $("chat").appendChild(typingEl);
  $("chat").scrollTop = $("chat").scrollHeight;

  try {
    const res = await fetch(`${API_BASE}/query`, {
      method: "POST",
      headers: authHeaders({"Content-Type": "application/json"}),
      body: JSON.stringify({question, top_k: 3, similarity_threshold: 0.2}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Query failed");
    typingEl.remove();
    renderExchange(null, data.answer, data.sources);
  } catch (err) {
    typingEl.remove();
    renderExchange(null, `Something went wrong: ${err.message}`, []);
  } finally {
    $("ask-btn").disabled = false;
    $("chat").scrollTop = $("chat").scrollHeight;
  }
}

function renderExchange(question, answer, sources){
  if (question) {
    const qEl = document.createElement("div");
    qEl.className = "msg msg-question";
    qEl.textContent = question;
    $("chat").appendChild(qEl);
  }
  const aEl = document.createElement("div");
  aEl.className = "msg msg-answer";
  const pages = [...new Set((sources || []).map(s => s.page_number))];
  aEl.innerHTML = `
    <div class="answer-text">${escapeHtml(answer)}</div>
    ${pages.length ? `<div class="citations">${pages.map(p => `<span class="citation-chip">Page ${p}</span>`).join("")}</div>` : ""}
  `;
  $("chat").appendChild(aEl);
  $("chat").scrollTop = $("chat").scrollHeight;
}

// ── Summarize ──
$("summarize-btn").onclick = async () => {
  $("summarize-btn").disabled = true;
  document.querySelector(".empty-state")?.remove();
  const typingEl = document.createElement("div");
  typingEl.className = "msg msg-answer";
  typingEl.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  $("chat").appendChild(typingEl);
  try {
    const res = await fetch(`${API_BASE}/summarize`, { method: "POST", headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Summarize failed");
    typingEl.remove();
    renderExchange("Summarize this document", data.summary, []);
  } catch (err) {
    typingEl.remove();
    renderExchange(null, `Something went wrong: ${err.message}`, []);
  } finally {
    $("summarize-btn").disabled = false;
  }
};

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
